{% extends 'base.html' %}
{% load static %}

{% block content_no_sidebar %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0" style="border-radius: 16px;">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <img src="{% static 'img/logo.png' %}" alt="Logo" class="img-fluid mb-4" style="max-height: 120px; filter: brightness(0) opacity(0.8);">
                    <h4 class="fw-bold text-dark mb-1">İstanbul İl Göç İdaresi</h4>
                    <p class="text-primary fw-semibold small">Araç Yönetim Sistemi</p>
                </div>
                
                {% if messages %}
                    {% for message in messages %}
                    <div class="alert alert-danger" style="border-radius: 8px;">{{ message }}</div>
                    {% endfor %}
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label text-muted fw-semibold small">KULLANICI ADI</label>
                        {{ form.username }}
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted fw-semibold small">ŞİFRE</label>
                        {{ form.password }}
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold shadow-sm" style="border-radius: 8px; font-size: 1.1rem;">
                        Giriş Yap
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
