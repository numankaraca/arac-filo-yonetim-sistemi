<td class="{{ col_class|default:'' }}">
    {% if date %}
        <div class="small text-muted mb-1">{{ date|date:"d.m.Y" }}</div>
    {% endif %}
    {% if days is None %}
        <span class="badge bg-secondary">Kayıt Yok</span>
    {% elif days < 0 %}
        <span class="badge bg-danger">Geçti ({{ days|default:0|stringformat:"+d"|slice:"1:" }} gün)</span>
    {% elif days <= 30 %}
        <span class="badge bg-warning text-dark">Yaklaşıyor ({{ days }} gün)</span>
    {% else %}
        <span class="badge bg-success">Geçerli ({{ days }} gün)</span>
    {% endif %}
</td>
